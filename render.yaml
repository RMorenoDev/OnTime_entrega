# Render.com Build Configuration for OnTime Backend

# Build command
buildCommand: "cd backend && composer install --no-dev --optimize-autoloader && php artisan config:cache"

# Start command  
startCommand: "cd backend && php artisan serve --host=0.0.0.0 --port=$PORT"

# Environment
phpVersion: "8.2"

# Health check
healthCheckPath: "/api/health"
